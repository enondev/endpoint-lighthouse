name: Endpoint Lighthouse Offline CI Suite

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-api-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: services/api/go.sum

      - name: Run API Go unit & integration tests with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -v -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Print total module coverage
        run: go tool cover -func=coverage.out | tail -n 1

  test-offline-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Worker dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-worker/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run AI Worker unit & integration tests (29/29)
        working-directory: services/ai-worker
        run: pytest -v

      - name: Run zero-quota E2E drift simulator
        run: python scripts/simulate_drift.py