name: Endpoint Lighthouse Offline CI Suite

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-offline-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Worker & E2E dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-worker/requirements.txt
          pip install -r requirements-dev.txt
          playwright install chromium --with-deps

      - name: Run AI Worker unit & integration tests (12/12)
        working-directory: services/ai-worker
        run: pytest -v

      - name: Run zero-quota E2E drift simulator
        run: python scripts/simulate_drift.py

      - name: Run offline Playwright browser E2E tests (4/4)
        run: pytest tests/e2e -v