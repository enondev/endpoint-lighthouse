name: Deploy Endpoint Lighthouse UI to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/staic.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject Cloudflare Web Analytics token
        run: |
          sed -i "s/__CF_WEBANALYTICS_TOKEN__/${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}/g" frontend/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload frontend only
          path: './frontend'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5