[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoint-lighthouse-ai-worker"
version = "1.0.0"
description = "On-demand AI schema drift and migration diffing analysis worker for Endpoint Lighthouse"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as asynchronous",
]
addopts = "-v --tb=short --strict-markers"